  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #486174" transform="translate(33.12 443.10832)">All three reversed city pairs for both estimators and every model. Descriptive differences only: changing direction changes training city,</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #486174" transform="translate(33.12 453.528281)">target distribution and sample size. No independent-direction test or exchangeability assumption is made.</text>
